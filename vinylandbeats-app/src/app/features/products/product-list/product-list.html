<div class="container mt-5">
  <h1 class="mb-3">Vitrină live</h1>
  <p class="text-muted">Produse aduse live din API, cu căutare instantanee.</p>

  <div class="mb-4">
    <input type="text" class="form-control form-control-lg"
           placeholder="Caută după nume, categorie sau etichetă..."
           [value]="query()"
           (input)="query.set($any($event.target).value)">
  </div>

  <div *ngIf="loading()" class="alert alert-info">Se încarcă...</div>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div *ngIf="!loading() && !error() && filtered().length === 0" class="alert alert-warning">
    Niciun produs găsit.
  </div>

  <div *ngIf="!loading() && !error()" class="row">
    <div *ngFor="let product of filtered()" class="col-md-6 col-lg-4 mb-4">
      <div class="card h-100">
        <img *ngIf="product.imageUrl" [src]="product.imageUrl" alt="{{ product.name }}"
             class="card-img-top" style="height: 180px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="text-muted mb-2">{{ product.categoryName }}</p>
          <p class="card-text">{{ product.description | slice:0:120 }}...</p>
          <p class="fw-bold">{{ product.price | number:'1.2-2' }} lei</p>
          <div *ngIf="product.tags.length" class="mb-2">
            <span *ngFor="let t of product.tags" class="badge bg-info me-1">{{ t.name }}</span>
          </div>
          <small class="text-muted d-block">Vândut de {{ product.sellerName }}</small>
        </div>
      </div>
    </div>
  </div>
</div>
