<div class="container mt-5">
  <div *ngIf="loading()" class="alert alert-info">Se încarcă...</div>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div *ngIf="product() as p">
    <div class="row">
      <div class="col-md-8">
        <h1>{{ p.name }}</h1>
        <img *ngIf="p.imageUrl" [src]="p.imageUrl" alt="{{ p.name }}" class="img-fluid rounded mb-3"
          style="max-height: 400px; object-fit: cover;">
        <p class="text-muted">
          <strong>Categorie:</strong> {{ p.categoryName }} |
          <strong>Vânzător:</strong> {{ p.sellerName }} |
          <strong>Stoc:</strong> {{ p.stock }}
        </p>
        <h4 class="text-primary">{{ p.price | number:'1.2-2' }} lei</h4>
        <hr />
        <p>{{ p.description }}</p>
        <div *ngIf="p.tags.length" class="mt-3">
          <strong>Etichete:</strong>
          <span *ngFor="let t of p.tags" class="badge bg-secondary me-1">{{ t.name }}</span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <ng-container *ngIf="canModify()">
              <button class="btn btn-warning w-100 mb-2" (click)="edit()">Editează</button>
              <button class="btn btn-danger w-100 mb-2" (click)="remove()">Șterge</button>
            </ng-container>
            <button class="btn btn-secondary w-100" (click)="goBack()">Înapoi la produse</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
